    <style>
        * {margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft YaHei", sans-serif;}
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            color: #fff;
            min-height: 100vh;
            padding-bottom: 100px;
        }
        .lang-container {position: fixed; top: 15px; right: 20px; z-index: 9999;}
        .lang-btn {background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); color: #fff; padding: 6px 16px; border-radius: 20px; cursor: pointer;}
        .lang-dropdown {
            position: absolute;
            top: 45px;
            right: 0;
            background: rgba(30, 40, 60, 0.95);
            border: 1px solid rgba(255,255,255,.2);
            border-radius: 12px;
            padding: 10px 0;
            min-width: 140px;
            display: none;
            box-shadow: 0 4px 20px rgba(0,0,0,.3);
        }
        .lang-option {padding: 10px 20px; cursor: pointer; transition: .2s; font-size: .95rem;}
        .lang-option:hover {background: rgba(255,255,255,.1);}
        .lang-option.active {color: #ffd700;}
        h1 {text-align: center; margin-top: 60px; font-size: 2rem; color: #ffd700;}
        .page-content {max-width: 900px; margin: 40px auto; padding: 0 20px; text-align: center;}
        .video-section {margin: 60px 0;}
        .video-section h2 {color: #ffd700; margin-bottom: 30px; font-size: 1.5rem;}
        .video-placeholder {
            background: rgba(255,255,255,.05);
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 12px;
            padding: 60px 20px;
            color: #888;
        }
        .app-link {
            display: inline-block;
            margin-top: 40px;
            padding: 15px 40px;
            background: linear-gradient(90deg, #ffd700, #ff8c00);
            color: #000;
            font-weight: bold;
            border-radius: 30px;
            text-decoration: none;
            font-size: 1.1rem;
            transition: transform .2s;
        }
        .app-link:hover {transform: scale(1.05);}
        .music-btn {
            position: fixed;
            bottom: 90px;
            right: 20px;
            background: rgba(255,255,255,.1);
            border: 1px solid rgba(255,255,255,.2);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            z-index: 100;
        }
        .music-btn.playing {background: rgba(255,215,0,.2); color: #ffd700;}
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-around;
            background: rgba(0,0,0,.5);
            padding: 12px 0;
            z-index: 50;
        }
        .nav-item {text-align: center; color: #888; font-size: .85rem; cursor: pointer;}
        .nav-item.active {color: #ffd700;}
        .page-nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 60px;
        }
        .page-btn {
            padding: 10px 25px;
            background: rgba(255,255,255,.1);
            border: 1px solid rgba(255,255,255,.2);
            color: #fff;
            border-radius: 20px;
            cursor: pointer;
            transition: all .2s;
        }
        .page-btn:hover:not(:disabled) {
            background: rgba(255,215,0,.2);
            border-color: #ffd700;
            color: #ffd700;
        }
        .page-btn:disabled {opacity: .3; cursor: not-allowed;}
        .page-num {color: #ffd700; font-size: .95rem;}
        .page-section {display: none;}
        .page-section.active {display: block;}

        let currentLang = "zh";
        let currentPage = 1;
        const totalPages = 4;

        function updatePage() {
            // 切换页面显示
            for (let i = 1; i <= totalPages; i++) {
                document.getElementById(`page${i}`).classList.remove("active");
            }
            document.getElementById(`page${currentPage}`).classList.add("active");
            
            // 更新页码指示
            document.getElementById("pageIndicator").textContent = `${currentPage} / ${totalPages}`;
            
            // 上一页/下一页按钮状态
            document.getElementById("prevBtn").disabled = currentPage === 1;
            document.getElementById("nextBtn").disabled = currentPage === totalPages;
            
            // 更新底部导航高亮
            document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
            document.querySelector(`.nav-item[data-page="${currentPage}"]`).classList.add("active");
        }
