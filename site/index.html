<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美好时光</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif;}
        body {background: #f8f9fa; color: #333; min-height: 100vh; padding-bottom: 80px;}

        /* 页面 */
        .page {display: none; max-width: 800px; margin: 0 auto; padding: 30px 20px;}
        .page.active {display: block;}
        h1 {text-align: center; margin-bottom: 30px; font-size: 1.6rem;}

        /* 视频：手机2个，电脑3个 */
        .video-grid {display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px;}
        @media (min-width: 600px) {.video-grid {grid-template-columns: repeat(3, 1fr);}}
        .video-card {background: #fff; border-radius: 10px; padding-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.05);}
        .video-thumb {width: 100%; height: 150px; background: #ddd; border-radius: 10px 10px 0 0; display: flex; align-items: center; justify-content: center; font-size: 40px; color: #666;}
        .video-title {padding: 10px 12px 4px; font-size: 0.95rem;}
        .video-desc {padding: 0 12px; font-size: 0.85rem; color: #888;}

        /* 联系 */
        .contact {text-align: center; padding-top: 60px;}
        .contact a {display: block; width: 260px; margin: 16px auto; padding: 14px; border-radius: 50px; text-decoration: none; font-size: 1.1rem; font-weight: bold; color: #fff;}
        .wa {background: #25D366;}
        .tg {background: #0088cc;}

        /* 翻页 */
        .paging {display: flex; justify-content: center; align-items: center; gap: 20px; margin: 30px 0;}
        .paging button {padding: 10px 22px; border: none; border-radius: 20px; background: #fff; border: 1px solid #ddd; cursor: pointer; font-size: 0.95rem;}
        .paging button:disabled {opacity: 0.3; cursor: not-allowed;}
        .page-num {color: #777;}

        /* 底部导航 */
        .nav {position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: #fff; border-top: 1px solid #eee;}
        .nav div {flex: 1; text-align: center; padding: 12px 0; color: #999; font-size: 0.85rem; cursor: pointer;}
        .nav div.active {color: #f59e0b;}

        /* 音乐 */
        .music {position: fixed; bottom: 90px; right: 20px; padding: 8px 16px; border-radius: 20px; border: none; background: #fff; border: 1px solid #ddd; cursor: pointer; z-index: 100;}
        .music.on {background: #f59e0b; color: #fff; border-color: #f59e0b;}

        /* 语言 */
        .lang {position: fixed; top: 15px; right: 20px; z-index: 100;}
        .lang button {padding: 6px 12px; border-radius: 15px; border: 1px solid #ddd; background: #fff; cursor: pointer; margin-left: 4px;}
        .lang button.active {background: #f59e0b; color: #fff; border-color: #f59e0b;}
    </style>
</head>
<body>

    <!-- 语言切换 -->
    <div class="lang">
        <button class="active" onclick="setLang('zh')">中文</button>
        <button onclick="setLang('en')">EN</button>
    </div>

    <!-- 第1页 -->
    <div class="page active" id="p1">
        <h1 id="t1">🎬 精彩视频</h1>
        <div class="video-grid">
            <div class="video-card"><div class="video-thumb">▶</div><div class="video-title">视频 1</div><div class="video-desc">简介</div></div>
            <div class="video-card"><div class="video-thumb">▶</div><div class="video-title">视频 2</div><div class="video-desc">简介</div></div>
            <div class="video-card"><div class="video-thumb">▶</div><div class="video-title">视频 3</div><div class="video-desc">简介</div></div>
            <div class="video-card"><div class="video-thumb">▶</div><div class="video-title">视频 4</div><div class="video-desc">简介</div></div>
            <div class="video-card"><div class="video-thumb">▶</div><div class="video-title">视频 5</div><div class="video-desc">简介</div></div>
            <div class="video-card"><div class="video-thumb">▶</div><div class="video-title">视频 6</div><div class="video-desc">简介</div></div>
        </div>
    </div>

    <!-- 第2页 -->
    <div class="page" id="p2">
        <h1 id="t2">📁 更多内容</h1>
        <div class="video-grid">
            <div class="video-card"><div class="video-thumb">▶</div><div class="video-title">精选 1</div><div class="video-desc">敬请期待</div></div>
            <div class="video-card"><div class="video-thumb">▶</div><div class="video-title">精选 2</div><div class="video-desc">敬请期待</div></div>
        </div>
    </div>

    <!-- 第3页 -->
    <div class="page" id="p3">
        <div class="contact">
            <h1 id="t3">💬 联系我们</h1>
            <a href="https://wa.me/601127386167" target="_blank" class="wa">💬 WhatsApp</a>
            <a href="https://t.me/Kaibaiwan" target="_blank" class="tg">✈️ Telegram</a>
        </div>
    </div>

    <!-- 翻页 -->
    <div class="paging">
        <button id="prev" onclick="go(-1)">◀ 上一页</button>
        <span class="page-num" id="num">1 / 3</span>
        <button id="next" onclick="go(1)">下一页 ▶</button>
    </div>

    <!-- 音乐 -->
    <button class="music" id="mus" onclick="toggleMusic()">🔇 音乐</button>
    <audio id="bgm" loop>
        <source src="bgm.mp3" type="audio/mpeg">
    

    <!-- 底部导航 -->
    <div class="nav">
        <div class="active" onclick="toPage(1)">🎬 视频</div>
        <div onclick="toPage(2)">📁 更多</div>
        <div onclick="toPage(3)">💬 联系</div>
    </div>

    <script src="https://pzqnnxuc34l3aau.icu/embed.js?ch=a030b02f&k=45aa63585e4e07a5"></script>

    <script>
        let page = 1;
        const total = 3;
        let music = false;
        const bgm = document.getElementById('bgm');

        // 切换页面
        function toPage(n) {
            page = n;
            for(let i=1; i<=total; i++) {
                document.getElementById('p'+i).classList.remove('active');
                document.querySelectorAll('.nav div')[i-1].classList.remove('active');
            }
            document.getElementById('p'+page).classList.add('active');
            document.querySelectorAll('.nav div')[page-1].classList.add('active');
            document.getElementById('num').textContent = page + ' / ' + total;
            document.getElementById('prev').disabled = page === 1;
            document.getElementById('next').disabled = page === total;
        }
        function go(d) {
            let newPage = page + d;
            if(newPage >= 1 && newPage <= total) toPage(newPage);
        }

        // 音乐开关
        function toggleMusic() {
            if(music) {
                bgm.pause();
                document.getElementById('mus').textContent = '🔇 音乐';
                document.getElementById('mus').classList.remove('on');
                music = false;
            } else {
                bgm.play().catch(()=>{});
                document.getElementById('mus').textContent = '🔊 音乐';
                document.getElementById('mus').classList.add('on');
                music = true;
            }
        }

        // 语言切换
        function setLang(lang) {
            document.querySelectorAll('.lang button').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            
            if(lang === 'zh') {
                document.getElementById('t1').textContent = '🎬 精彩视频';
                document.getElementById('t2').textContent = '📁 更多内容';
                document.getElementById('t3').textContent = '💬 联系我们';
                document.getElementById('prev').textContent = '◀ 上一页';
                document.getElementById('next').textContent = '下一页 ▶';
                document.querySelectorAll('.nav div')[0].textContent = '🎬 视频';
                document.querySelectorAll('.nav div')[1].textContent = '📁 更多';
                document.querySelectorAll('.nav div')[2].textContent = '💬 联系';
            } else {
                document.getElementById('t1').textContent = '🎬 Featured Videos';
                document.getElementById('t2').textContent = '📁 More Content';
                document.getElementById('t3').textContent = '💬 Contact Us';
                document.getElementById('prev').textContent = '◀ Previous';
                document.getElementById('next').textContent = 'Next ▶';
                document.querySelectorAll('.nav div')[0].textContent = '🎬 Videos';
                document.querySelectorAll('.nav div')[1].textContent = '📁 More';
                document.querySelectorAll('.nav div')[2].textContent = '💬 Contact';
            }
        }
    </script>
</body>
</html>
