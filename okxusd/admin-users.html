<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用户管理 - 管理后台</title>
<script src="config.js"></script>
<style>
:root{--gold:#F3BA2F;--bg-dark:#1E2026;--card:#2B2F36;--input:#474D57;--green:#089981;--red:#EF4444;--border-color:#474D57;--frozen:#DC2626}
*{margin:0;padding:0;box-sizing:border-box}
body{background-color:var(--bg-dark);color:#fff;font-family:-apple-system,sans-serif;padding:20px}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:15px;border-bottom:1px solid #333}
h1{font-size:22px;color:var(--gold)}
.back{color:#aaa;text-decoration:none;font-size:14px}
.user-card{background:var(--card);border-radius:8px;padding:16px;margin-bottom:12px;border-left:3px solid transparent}
.user-card.frozen{border-left-color:var(--frozen);opacity:0.85}
.user-row{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;border-bottom:1px solid #333}
.user-row:last-child{border-bottom:none}
.label{color:#888;width:120px;flex-shrink:0}
.value{color:#fff;word-break:break-all}
.balance{color:var(--gold);font-weight:600}
.status-normal{color:var(--green)}
.status-frozen{color:var(--frozen)}
.btn-group{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
button{padding:6px 12px;border:none;border-radius:4px;cursor:pointer;font-size:13px}
.btn-edit{background:#3B82F6;color:#fff}
.btn-frozen{background:var(--frozen);color:#fff}
.btn-unfrozen{background:var(--green);color:#fff}
.empty{text-align:center;color:#666;padding:40px}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:1000;display:none}
.modal-box{background:var(--card);padding:24px;border-radius:8px;width:90%;max-width:400px}
.modal-box h3{margin-bottom:16px;color:var(--gold)}
input{width:100%;padding:10px;margin-bottom:12px;background:#1E2026;border:1px solid #444;border-radius:4px;color:#fff;font-size:14px}
.modal-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:10px}
.btn-save{background:var(--gold);color:#000}
.btn-cancel{background:#555;color:#fff}
</style>
</head>
<body>

<div class="header">
  <a href="admin.html" class="back">← 返回管理中心</a>
  <h1>用户管理</h1>
  <span></span>
</div>

<div id="userList"></div>

<div id="editModal" class="modal">
  <div class="modal-box">
    <h3>修改用户信息</h3>
    <input type="hidden" id="editIndex">
    <input type="password" id="newLoginPwd" placeholder="新登录密码（留空不修改）">
    <input type="password" id="newTradePwd" placeholder="新交易密码（留空不修改）">
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn-save" onclick="saveChanges()">保存</button>
    </div>
  </div>
</div>

<script>
if (typeof DataStore !== 'undefined') {
  DataStore.log('访问页面', 'admin-users.html');
  if (CONFIG.systemStatus !== 'open') {
    document.body.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:70vh;color:#fff;text-align:center"><div style="font-size:48px;margin-bottom:20px">🔧</div><h2>系统维护中</h2><p style="color:#888">' + (CONFIG.notice || '请稍后再试') + '</p></div>';
  }
  if (CONFIG.notice) {
    const noticeBar = document.createElement('div');
    noticeBar.style.cssText = 'background:rgba(243,186,47,0.1);color:#F3BA2F;padding:10px;text-align:center;font-size:14px;position:sticky;top:0;z-index:999';
    noticeBar.textContent = CONFIG.notice;
    document.body.insertBefore(noticeBar, document.body.firstChild);
  }
}

function loadUsers(){
  const list = document.getElementById('userList');
  const users = JSON.parse(localStorage.getItem('allUsers') || '[]');
  
  if(users.length === 0){
    list.innerHTML = '<div class="empty">暂无注册用户</div>';
    return;
  }
  
  list.innerHTML = users.map((user, index) => `
    <div class="user-card ${user.frozen ? 'frozen' : ''}">
      <div class="user-row"><span class="label">用户名</span><span class="value">${user.username}</span></div>
      <div class="user-row"><span class="label">登录密码</span><span class="value">****** <button style="padding:2px 6px;font-size:11px;margin-left:6px;background:#555;border:none;color:#fff;border-radius:2px" onclick="alert('为安全起见，密码不显示明文，可直接重置')">重置</button></span></div>
      <div class="user-row"><span class="label">交易密码</span><span class="value">****** <button style="padding:2px 6px;font-size:11px;margin-left:6px;background:#555;border:none;color:#fff;border-radius:2px" onclick="alert('为安全起见，密码不显示明文，可直接重置')">重置</button></span></div>
      <div class="user-row"><span class="label">账户余额</span><span class="value balance">${parseFloat(user.balance || 0).toFixed(2)} USDT</span></div>
      <div class="user-row"><span class="label">注册时间</span><span class="value">${user.regTime || '未知'}</span></div>
      <div class="user-row"><span class="label">账户状态</span><span class="value ${user.frozen ? 'status-frozen' : 'status-normal'}">${user.frozen ? '❌ 已冻结' : '✅ 正常'}</span></div>
      <div class="btn-group">
        <button class="btn-edit" onclick="openEdit(${index})">🔐 修改密码</button>
        ${user.frozen 
          ? `<button class="btn-unfrozen" onclick="toggleFreeze(${index})">🔓 解除冻结</button>`
          : `<button class="btn-frozen" onclick="toggleFreeze(${index})">❄️ 冻结余额</button>`
        }
      </div>
    </div>
  `).join('');
}
