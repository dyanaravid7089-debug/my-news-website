<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>币种管理 - 管理后台</title>
<script src="config.js"></script>
<style>
:root{--gold:#F3BA2F;--bg-dark:#1E2026;--card:#2B2F36;--input:#474D57;--green:#089981;--red:#EF4444;--border-color:#474D57;--blue:#3B82F6}
*{margin:0;padding:0;box-sizing:border-box}
body{background-color:var(--bg-dark);color:#fff;font-family:-apple-system,sans-serif;padding:20px}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:15px;border-bottom:1px solid #333}
h1{font-size:22px;color:var(--gold)}
.back{color:#aaa;text-decoration:none;font-size:14px}
.btn-add{background:var(--green);color:#fff;border:none;padding:8px 16px;border-radius:4px;cursor:pointer;font-size:14px;margin-bottom:16px}
.coin-card{background:var(--card);border-radius:8px;padding:16px;margin-bottom:12px}
.coin-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:14px;flex-wrap:wrap;gap:8px}
.coin-name{font-size:18px;font-weight:600;color:var(--gold)}
.tag{background:#333;padding:2px 8px;border-radius:12px;font-size:12px;color:#aaa}
.rate-up{color:var(--green)}
.rate-down{color:var(--red)}
.btn-group{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
button{padding:6px 12px;border:none;border-radius:4px;cursor:pointer;font-size:13px}
.btn-edit{background:var(--blue);color:#fff}
.btn-del{background:var(--red);color:#fff}
.empty{text-align:center;color:#666;padding:40px}

/* 弹窗 */
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:1000;display:none}
.modal-box{background:var(--card);padding:24px;border-radius:8px;width:90%;max-width:450px}
.modal-box h3{margin-bottom:16px;color:var(--gold)}
input,select{width:100%;padding:10px;margin-bottom:12px;background:#1E2026;border:1px solid #444;border-radius:4px;color:#fff;font-size:14px}
label{display:block;margin-bottom:4px;color:#aaa;font-size:13px}
.modal-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:10px}
.btn-save{background:var(--gold);color:#000}
.btn-cancel{background:#555;color:#fff}
</style>
</head>
<body>

<div class="header">
  <a href="admin-dashboard.html" class="back">← 返回主控台</a>
  <h1>🪙 币种管理</h1>
  <span></span>
</div>

<button class="btn-add" onclick="openModal()">➕ 添加币种</button>
<div id="coinList"></div>

<!-- 添加/编辑弹窗 -->
<div id="coinModal" class="modal">
  <div class="modal-box">
    <h3 id="modalTitle">添加币种</h3>
    <input type="hidden" id="editIndex">
    
    <label>币种名称（如 BTC/USDT）</label>
    <input type="text" id="coinName" placeholder="BTC/USDT">
    
    <label>当前价格（USDT）</label>
    <input type="number" step="0.0001" id="coinPrice" placeholder="68500">
    
    <label>设置涨幅方向</label>
    <select id="rateDir">
      <option value="up">📈 上涨</option>
      <option value="down">📉 下跌</option>
    </select>
    
    <label>涨跌幅（百分比，如 2.5）</label>
    <input type="number" step="0.01" id="rateVal" placeholder="2.5">
    
    <label>生效时间（分钟后自动重置）</label>
    <input type="number" id="rateMins" placeholder="5">
    
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn-save" onclick="saveCoin()">保存</button>
    </div>
  </div>
</div>

<script>
if (typeof DataStore !== 'undefined') {
  DataStore.log('访问页面', 'admin-coin-manage.html');
  if (CONFIG.systemStatus !== 'open') {
    document.body.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:70vh;color:#fff;text-align:center"><div style="font-size:48px;margin-bottom:20px">🔧</div><h2>系统维护中</h2><p style="color:#888">' + (CONFIG.notice || '请稍后再试') + '</p></div>';
  }
}

// 加载币种列表
function loadCoins(){
  const list = document.getElementById('coinList');
  const coins = JSON.parse(localStorage.getItem('coinList') || '[]');
  
  if(coins.length === 0){
    list.innerHTML = '<div class="empty">暂无币种，点击上方"添加币种"开始</div>';
    return;
  }
  
  list.innerHTML = coins.map((coin, index) => `
    <div class="coin-card">
      <div class="coin-row">
        <span class="coin-name">${coin.name}</span>
        <span class="tag">价格: ${coin.price} USDT</span>
      </div>
      <div class="coin-row">
        <span>涨幅设置：<span class="${coin.dir === 'up' ? 'rate-up' : 'rate-down'}">${coin.dir === 'up' ? '+' : ''}${coin.rate}%</span></span>
        <span class="tag">${coin.mins} 分钟后自动重置</span>
      </div>
      <div class="coin-row">
        <span>生效状态：${coin.active ? '<span style="color:var(--green)">✅ 生效中</span>' : '<span style="color:#888">⏸ 未生效</span>'}</span>
        <span class="tag">更新: ${coin.updateTime || '—'}</span>
      </div>
      <div class="btn-group">
        <button class="btn-edit" onclick="toggleActive(${index})">${coin.active ? '⏸ 暂停' : '▶ 生效'}</button>
        <button class="btn-edit" onclick="openModal(${index})">✏️ 编辑</button>
        <button class="btn-del" onclick="delCoin(${index})">🗑 删除</button>
      </div>
    </div>
  `).join('');
}

// 打开弹窗
function openModal(index = null){
  const modal = document.getElementById('coinModal');
  modal.style.display = 'flex';
  document.getElementById('modalTitle').textContent = index === null ? '添加币种' : '编辑币种';
  document.getElementById('editIndex').value = index === null ? '' : index;
  
  if(index !== null){
    const coins = JSON.parse(localStorage.getItem('coinList') || '[]');
    const c = coins[index];
    document.getElementById('coinName').value = c.name;
    document.getElementById('coinPrice').value = c.price;
    document.getElementById('rateDir').value = c.dir;
    document.getElementById('rateVal').value = c.rate;
    document.getElementById('rateMins').value = c.mins;
  }else{
    document.getElementById('coinName').value = '';
    document.getElementById('coinPrice').value = '';
    document.getElementById('rateDir').value = 'up';
    document.getElementById('rateVal').value = '';
    document.getElementById('rateMins').value = '';
  }
}

function closeModal(){
  document.getElementById('coinModal').style.display = 'none';
}

// 保存币种
function saveCoin(){
  const name = document.getElementById('coinName').value.trim();
  const price = parseFloat(document.getElementById('coinPrice').value);
  const dir = document.getElementById('rateDir').value;
  const rate = parseFloat(document.getElementById('rateVal').value);
  const mins = parseInt(document.getElementById('rateMins').value);
  const editIndex = document.getElementById('editIndex').value;
  
  if(!name || !price || !rate || !mins){
    alert('❌ 所有项都要填写！');
    return;
  }
  
  const coins = JSON.parse(localStorage.getItem('coinList') || '[]');
  const now = new Date().toLocaleString('zh-CN');
  
  if(editIndex === ''){
    // 新增
    coins.push({
      name, price, dir, rate, mins,
      active: false,
      createTime: now,
      updateTime: null
    });
  }else{
    // 编辑
    const idx = parseInt(editIndex);
    coins[idx] = {
      ...coins[idx],
      name, price, dir, rate, mins,
      updateTime: now
    };
  }
  
  localStorage.setItem('coinList', JSON.stringify(coins));
  closeModal();
  loadCoins();
  alert('✅ 保存成功！' + (editIndex === '' ? '已添加新币种' : '币种信息已更新'));
}

// 切换生效状态
function toggleActive(index){
  const coins = JSON.parse(localStorage.getItem('coinList') || '[]');
  
  // 先把其他全部设为未生效
  coins.forEach((c,i) => c.active = (i === index));
  
  // 如果开启生效，设置自动重置倒计时
  if(coins[index].active){
    alert(`✅ ${coins[index].name} 涨幅已生效！\n将在 ${coins[index].mins} 分钟后自动恢复正常`);
    
    // 自动重置定时器
    setTimeout(() => {
      const cList = JSON.parse(localStorage.getItem('coinList') || '[]');
      if(cList[index]){
        cList[index].active = false;
        localStorage.setItem('coinList', JSON.stringify(cList));
        loadCoins();
      }
    }, coins[index].mins * 60 * 1000);
  }
  
  localStorage.setItem('coinList', JSON.stringify(coins));
  loadCoins();
}

// 删除币种
function delCoin(index){
  if(!confirm('确定删除这个币种吗？')) return;
  const coins = JSON.parse(localStorage.getItem('coinList') || '[]');
  coins.splice(index, 1);
  localStorage.setItem('coinList', JSON.stringify(coins));
  loadCoins();
  alert('✅ 已删除');
}

loadCoins();
</script>

</body>
</html>
