<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>提币申请审核 - 管理后台</title>
<script src="config.js"></script>
<style>
:root{--gold:#F3BA2F;--bg-dark:#1E2026;--card:#2B2F36;--input:#474D57;--green:#089981;--red:#EF4444;--border-color:#474D57;--pending:#F59E0B}
*{margin:0;padding:0;box-sizing:border-box}
body{background-color:var(--bg-dark);color:#fff;font-family:-apple-system,sans-serif;padding:20px}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:15px;border-bottom:1px solid #333}
h1{font-size:22px;color:var(--gold)}
.back{color:#aaa;text-decoration:none;font-size:14px}
.apply-item{background:var(--card);border-radius:8px;padding:16px;margin-bottom:12px}
.apply-row{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}
.status-pending{color:var(--pending)}
.status-pass{color:var(--green)}
.status-reject{color:var(--red)}
.btn-group{display:flex;gap:10px;margin-top:12px}
button{padding:8px 16px;border:none;border-radius:4px;cursor:pointer;font-size:14px}
.btn-pass{background:var(--green);color:#fff}
.btn-reject{background:var(--red);color:#fff}
.empty{text-align:center;color:#666;padding:40px}
</style>
</head>
<body>

<div class="header">
  <a href="admin.html" class="back">← 返回管理中心</a>
  <h1>提币申请审核</h1>
  <span></span>
</div>

<div id="applyList"></div>

<script>
if (typeof DataStore !== 'undefined') {
  DataStore.log('访问页面', 'admin-withdraw-apply.html');
  if (CONFIG.systemStatus !== 'open') {
    document.body.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:70vh;color:#fff;text-align:center"><div style="font-size:48px;margin-bottom:20px">🔧</div><h2>系统维护中</h2><p style="color:#888">' + (CONFIG.notice || '请稍后再试') + '</p></div>';
  }
  if (CONFIG.notice) {
    const noticeBar = document.createElement('div');
    noticeBar.style.cssText = 'background:rgba(243,186,47,0.1);color:#F3BA2F;padding:10px;text-align:center;font-size:14px;position:sticky;top:0;z-index:999';
    noticeBar.textContent = CONFIG.notice;
    document.body.insertBefore(noticeBar, document.body.firstChild);
  }
}

function loadApplies(){
  const list = document.getElementById('applyList');
  const applies = JSON.parse(localStorage.getItem('withdrawApplies') || '[]');
  
  if(applies.length === 0){
    list.innerHTML = '<div class="empty">暂无提币申请</div>';
    return;
  }
  
  list.innerHTML = applies.map((item, index) => `
    <div class="apply-item">
      <div class="apply-row"><span>用户账号</span><span>${item.username}</span></div>
      <div class="apply-row"><span>提币金额</span><span style="color:var(--gold)">${item.amount} USDT</span></div>
      <div class="apply-row"><span>提币地址</span><span style="color:#aaa;font-size:12px;word-break:break-all">${item.address}</span></div>
      <div class="apply-row"><span>申请时间</span><span>${item.time}</span></div>
      <div class="apply-row"><span>当前状态</span><span class="status-${item.status === '待审核' ? 'pending' : item.status === '已通过' ? 'pass' : 'reject'}">${item.status}</span></div>
      ${item.status === '待审核' ? `
      <div class="btn-group">
        <button class="btn-pass" onclick="approve(${index})">✅ 通过</button>
        <button class="btn-reject" onclick="reject(${index})">❌ 驳回</button>
      </div>
      ` : ''}
    </div>
  `).join('');
}

function approve(index){
  const applies = JSON.parse(localStorage.getItem('withdrawApplies') || '[]');
  const users = JSON.parse(localStorage.getItem('allUsers') || '[]');
  const userIndex = users.findIndex(u => u.username === applies[index].username);
  
  if(userIndex === -1 || parseFloat(users[userIndex].balance || 0) < parseFloat(applies[index].amount)){
    alert('❌ 用户余额不足，无法通过审核！');
    return;
  }
  
  if(!confirm(`确认通过审核？\n将扣除用户余额：${applies[index].amount} USDT`)) return;
  
  users[userIndex].balance = (parseFloat(users[userIndex].balance) - parseFloat(applies[index].amount)).toFixed(2);
  localStorage.setItem('allUsers', JSON.stringify(users));
  
  applies[index].status = '已通过';
  localStorage.setItem('withdrawApplies', JSON.stringify(applies));
  
  loadApplies();
  alert('✅ 审核已通过，余额已扣除！');
}

function reject(index){
  const reason = prompt('请输入驳回原因：');
  if(reason === null) return;
  const applies = JSON.parse(localStorage.getItem('withdrawApplies') || '[]');
  applies[index].status = '已驳回';
  applies[index].reason = reason;
  localStorage.setItem('withdrawApplies', JSON.stringify(applies));
  loadApplies();
  alert('❌ 已驳回');
}

loadApplies();
</script>

</body>
</html>
