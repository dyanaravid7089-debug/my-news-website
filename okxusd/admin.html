<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Binex - 后台管理登录</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#1E2026;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;}
    .login-box{background:#2B2F36;border-radius:12px;padding:40px 30px;width:90%;max-width:400px;box-shadow:0 4px 20px rgba(0,0,0,0.3);}
    .logo{text-align:center;margin-bottom:30px;}
    .logo h1{color:#F3BA2F;font-size:28px;letter-spacing:2px;}
    .logo p{color:#888;font-size:14px;margin-top:5px;}
    .form-group{margin-bottom:20px;}
    label{display:block;font-size:14px;color:#ccc;margin-bottom:8px;}
    input{width:100%;padding:12px 14px;background:#474D57;border:none;border-radius:6px;color:#fff;font-size:15px;}
    input:focus{outline:2px solid #F3BA2F;}
    .btn-login{width:100%;padding:14px;background:#F3BA2F;border:none;border-radius:6px;color:#111;font-size:16px;font-weight:bold;cursor:pointer;margin-top:10px;transition:0.2s;}
    .btn-login:hover{background:#e0a928;}
    .error-tip{color:#F23645;font-size:13px;margin-top:10px;display:none;}
    .footer-text{text-align:center;margin-top:25px;font-size:12px;color:#666;}
  </style>
</head>
<body>
  <div class="login-box">
    <div class="logo">
      <h1>BINEX</h1>
      <p>管理系统 · 仅限管理员访问</p>
    </div>
    <form id="loginForm">
      <div class="form-group">
        <label>管理员账号</label>
        <input type="text" id="adminUser" placeholder="请输入账号">
      </div>
      <div class="form-group">
        <label>登录密码</label>
        <input type="password" id="adminPass" placeholder="请输入密码">
      </div>
      <button type="submit" class="btn-login">登录管理后台</button>
      <div class="error-tip" id="errorTip">账号或密码错误</div>
    </form>
    <div class="footer-text">
      默认账号：admin &nbsp;|&nbsp; 默认密码：admin123<br>
      首次登录后请及时修改密码
    </div>
  </div>

  <script>
    // 后台登录验证
    const CORRECT_USER = 'admin';
    const CORRECT_PASS = 'admin123';

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const user = document.getElementById('adminUser').value.trim();
      const pass = document.getElementById('adminPass').value;
      const errorTip = document.getElementById('errorTip');
      
      if(user === CORRECT_USER && pass === CORRECT_PASS) {
        // 登录成功，记录状态并跳转
        localStorage.setItem('binex_admin_logged', 'true');
        localStorage.setItem('binex_admin_time', new Date().toISOString());
        window.location.href = 'admin-dashboard.html';
      } else {
        errorTip.style.display = 'block';
        setTimeout(() => errorTip.style.display = 'none', 3000);
      }
    });
  </script>
</body>
</html>
