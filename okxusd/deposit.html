<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Binex - 充值</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#1E2026;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:80px;}
    .header{padding:20px;text-align:center;border-bottom:1px solid #2B2F36;position:relative;}
    .back{position:absolute;top:20px;left:20px;color:#888;text-decoration:none;}
    .logo{font-size:18px;font-weight:bold;color:#F3BA2F;}
    .container{max-width:480px;margin:0 auto;padding:20px;}
    .card{background:#2B2F36;border-radius:12px;padding:25px;border:1px solid #474D57;}
    .card h2{text-align:center;margin-bottom:25px;color:#F3BA2F;font-size:20px;}
    .form-group{margin-bottom:20px;}
    label{display:block;margin-bottom:8px;color:#ccc;font-size:14px;}
    select, input{width:100%;padding:12px;background:#1E2026;border:1px solid #474D57;border-radius:6px;color:#fff;font-size:15px;}
    select:focus, input:focus{outline:none;border-color:#F3BA2F;}
    .address-box{background:#1E2026;border:1px solid #474D57;border-radius:6px;padding:15px;margin:10px 0;word-break:break-all;font-family:monospace;font-size:13px;color:#ccc;}
    .copy-btn{background:#F3BA2F;color:#000;border:none;border-radius:4px;padding:6px 12px;cursor-pointer;font-size:13px;margin-top:8px;}
    .tips{font-size:12px;color:#888;line-height:1.6;margin-top:10px;}
    .tips strong{color:#F23645;}
    .btn{width:100%;padding:14px;background:#F3BA2F;color:#000;font-size:16px;font-weight:bold;border:none;border-radius:8px;cursor:pointer;margin-top:10px;}
    .record-link{text-align:center;margin-top:20px;}
    .record-link a{color:#F3BA2F;text-decoration:none;font-size:14px;}
    .hidden{display:none !important;}
  </style>
</head>
<body>
  <a href="assets.html" class="back">← 返回</a>
  <div class="header">
    <div class="logo">BINEX · 充值</div>
  </div>

  <div class="container">
    <div class="card">
      <h2>数字资产充值</h2>
      
      <div class="form-group">
        <label>选择币种</label>
        <select id="coinSelect">
          <option value="">请选择币种</option>
          <option value="USDT">USDT - 泰达币</option>
          <option value="BTC">BTC - 比特币</option>
          <option value="ETH">ETH - 以太坊</option>
          <option value="SOL">SOL - Solana</option>
          <option value="BNB">BNB - BNB</option>
          <option value="XRP">XRP - 瑞波币</option>
        </select>
      </div>

      <div class="form-group hidden" id="networkGroup">
        <label>选择网络</label>
        <select id="networkSelect">
          <option value="">请选择网络</option>
        </select>
      </div>

      <div class="form-group hidden" id="addressGroup">
        <label>充值地址</label>
        <div class="address-box" id="addressBox"></div>
        <button class="copy-btn" id="copyBtn">复制地址</button>
      </div>

      <div class="tips hidden" id="tipsBlock">
        <strong>⚠️ 重要提示：</strong><br>
        1. 请确保转出的币种和网络与上述选择完全一致，否则资产将永久丢失<br>
        2. 充值到账需要网络确认，一般约 5-30 分钟<br>
        3. 最小充值金额：<span id="minAmount">0.00</span>
      </div>

      <button class="btn hidden" id="confirmBtn">我已理解，下一步</button>
      
      <div class="record-link">
        <a href="deposit-records.html">查看充值记录 →</a>
      </div>
    </div>
  </div>

  <script>
    // 模拟充值地址配置
    const depositData = {
      USDT: {
        networks: [
          {id:'trc20', name:'TRC20 (波场)', addr:'TN59HtP8nQjzQvZv6QxQv8vZv6QxQv8vZ', min:'10.00 USDT'},
          {id:'erc20', name:'ERC20 (以太坊)', addr:'0x8f4d2c3e1a9b0c2d3e4f5a6b7c8d9e0f1a2b3c4d', min:'30.00 USDT'},
          {id:'bsc', name:'BSC (币安链)', addr:'0x7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b', min:'20.00 USDT'}
        ]
      },
      BTC: {
        networks: [
          {id:'btc', name:'BTC 主网', addr:'bc1qxy2kgdygjrsqtzq2n0yrf2493p83kkfjhx0wlh', min:'0.001 BTC'}
        ]
      },
      ETH: {
        networks: [
          {id:'erc20', name:'ERC20 (以太坊)', addr:'0x2c3e1a9b0d2c4e5f6a7b8c9d0e1f2a3b4c5d6e7f', min:'0.01 ETH'}
        ]
      },
      SOL: {
        networks: [
          {id:'sol', name:'Solana', addr:'7xKXtg2CW87d97TXJSDpbD5jBkheTqA83TZRuJosgAsU', min:'0.1 SOL'}
        ]
      },
      BNB: {
        networks: [
          {id:'bsc', name:'BSC (币安链)', addr:'0x4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c', min:'0.01 BNB'}
        ]
      },
      XRP: {
        networks: [
          {id:'xrp', name:'XRP 主网', addr:'rP4mpb6hWjXgGm7sHn8kL9zQwertyuiopasdfg', min:'10.00 XRP'}
        ]
      }
    };

    const coinSelect = document.getElementById('coinSelect');
    const networkGroup = document.getElementById('networkGroup');
    const networkSelect = document.getElementById('networkSelect');
    const addressGroup = document.getElementById('addressGroup');
    const addressBox = document.getElementById('addressBox');
    const tipsBlock = document.getElementById('tipsBlock');
    const minAmount = document.getElementById('minAmount');
    const confirmBtn = document.getElementById('confirmBtn');
    const copyBtn = document.getElementById('copyBtn');

    let selectedAddr = '';

    // 选择币种
    coinSelect.addEventListener('change', () => {
      const coin = coinSelect.value;
      if (!coin) {
        resetView();
        return;
      }
      
      const data = depositData[coin];
      networkSelect.innerHTML = '<option value="">请选择网络</option>';
      data.networks.forEach(n=>{
        const opt = document.createElement('option');
        opt.value = n.id;
        opt.textContent = n.name;
        opt.dataset.addr = n.addr;
        opt.dataset.min = n.min;
        networkSelect.appendChild(opt);
      });
      
      networkGroup.classList.remove('hidden');
      addressGroup.classList.add('hidden');
      tipsBlock.classList.add('hidden');
      confirmBtn.classList.add('hidden');
    });

    // 选择网络
    networkSelect.addEventListener('change', () => {
      const opt = networkSelect.selectedOptions[0];
      if (!opt.value) {
        addressGroup.classList.add('hidden');
        tipsBlock.classList.add('hidden');
        confirmBtn.classList.add('hidden');
        return;
      }
      
      selectedAddr = opt.dataset.addr;
      addressBox.textContent = selectedAddr;
      minAmount.textContent = opt.dataset.min;
      
      addressGroup.classList.remove('hidden');
      tipsBlock.classList.remove('hidden');
      confirmBtn.classList.remove('hidden');
    });

    // 复制地址
    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(selectedAddr);
        copyBtn.textContent = '已复制!';
        setTimeout(()=>copyBtn.textContent='复制地址', 2000);
      } catch {
        const textarea = document.createElement('textarea');
        textarea.value = selectedAddr;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        copyBtn.textContent = '已复制!';
        setTimeout(()=>copyBtn.textContent='复制地址', 2000);
      }
    });

    // 确认并记录
    confirmBtn.addEventListener('click', () => {
      const coin = coinSelect.value;
      const net = networkSelect.selectedOptions[0].textContent;
      const record = {
        id: Date.now(),
        coin,
        network: net,
        address: selectedAddr,
        time: new Date().toLocaleString('zh-CN'),
        status: '待确认'
      };
      
      const records = JSON.parse(localStorage.getItem('binex_deposit_records')||'[]');
      records.unshift(record);
      localStorage.setItem('binex_deposit_records', JSON.stringify(records));
      
      alert('充值地址已生成并保存！\n请将资产转入上述地址，到账后会自动更新余额。');
    });

    function resetView() {
      networkGroup.classList.add('hidden');
      addressGroup.classList.add('hidden');
      tipsBlock.classList.add('hidden');
      confirmBtn.classList.add('hidden');
      selectedAddr = '';
    }
  </script>
</body>
</html>
