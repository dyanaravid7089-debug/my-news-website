<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>价格设置 - 管理后台</title>
<script src="config.js"></script>
<style>
:root{--gold:#F3BA2F;--bg-dark:#1E2026;--card:#2B2F36;--input:#474D57;--green:#089981;--red:#EF4444;--border-color:#474D57;--blue:#3B82F6}
*{margin:0;padding:0;box-sizing:border-box}
body{background-color:var(--bg-dark);color:#fff;font-family:-apple-system,sans-serif;padding:20px}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:15px;border-bottom:1px solid #333}
h1{font-size:22px;color:var(--gold)}
.back{color:#aaa;text-decoration:none;font-size:14px}
.btn-add{background:var(--green);color:#fff;border:none;padding:8px 16px;border-radius:4px;cursor:pointer;font-size:14px;margin-bottom:16px}
.coin-card{background:var(--card);border-radius:8px;padding:16px;margin-bottom:12px}
.coin-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:15px;border-bottom:1px solid #333}
.coin-row:last-child{border-bottom:none}
.coin-name{font-size:17px;font-weight:600;color:var(--gold)}
.current-price{font-size:18px;color:#fff}
.btn-group{display:flex;gap:8px;margin-top:10px}
button{padding:6px 12px;border:none;border-radius:4px;cursor:pointer;font-size:13px}
.btn-edit{background:var(--blue);color:#fff}
.btn-del{background:var(--red);color:#fff}
.empty{text-align:center;color:#666;padding:40px}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:1000;display:none}
.modal-box{background:var(--card);padding:24px;border-radius:8px;width:90%;max-width:400px}
.modal-box h3{margin-bottom:16px;color:var(--gold)}
input{width:100%;padding:10px;margin-bottom:12px;background:#1E2026;border:1px solid #444;border-radius:4px;color:#fff;font-size:14px}
.modal-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:10px}
.btn-save{background:var(--gold);color:#000}
.btn-cancel{background:#555;color:#fff}
</style>
</head>
<body>

<div class="header">
  <a href="admin-dashboard.html" class="back">← 返回主控台</a>
  <h1>💰 币种价格设置</h1>
  <span></span>
</div>

<button class="btn-add" onclick="openModal()">➕ 添加币种</button>
<div id="priceList"></div>

<div id="priceModal" class="modal">
  <div class="modal-box">
    <h3 id="priceModalTitle">添加币种</h3>
    <input type="hidden" id="editIndex">
    <label style="color:#aaa;font-size:13px">币种名称</label>
    <input type="text" id="coinName" placeholder="BTC/USDT">
    <label style="color:#aaa;font-size:13px">当前价格 (USDT)</label>
    <input type="number" step="0.0001" id="coinPrice" placeholder="68500.00">
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn-save" onclick="savePrice()">保存</button>
    </div>
  </div>
</div>

<script>
if (typeof DataStore !== 'undefined') {
  DataStore.log('访问页面', 'admin-price-setting.html');
}

function loadPrices(){
  const list = document.getElementById('priceList');
  const coins = JSON.parse(localStorage.getItem('coinPrices') || '[]');
  
  if(coins.length === 0){
    list.innerHTML = '<div class="empty">暂无币种，点击上方"添加币种"开始</div>';
    return;
  }
  
  list.innerHTML = coins.map((coin, index) => `
    <div class="coin-card">
      <div class="coin-row">
        <span class="coin-name">${coin.name}</span>
        <span class="current-price">${parseFloat(coin.price).toLocaleString()} USDT</span>
      </div>
      <div class="btn-group">
        <button class="btn-edit" onclick="openModal(${index})">✏️ 修改价格</button>
        <button class="btn-del" onclick="delCoin(${index})">🗑 删除</button>
      </div>
    </div>
  `).join('');
}

function openModal(index = null){
  document.getElementById('priceModal').style.display = 'flex';
  document.getElementById('priceModalTitle').textContent = index === null ? '添加币种' : '修改价格';
  document.getElementById('editIndex').value = index === null ? '' : index;
  
  if(index !== null){
    const coins = JSON.parse(localStorage.getItem('coinPrices') || '[]');
    document.getElementById('coinName').value = coins[index].name;
    document.getElementById('coinPrice').value = coins[index].price;
  }else{
    document.getElementById('coinName').value = '';
    document.getElementById('coinPrice').value = '';
  }
}

function closeModal(){
  document.getElementById('priceModal').style.display = 'none';
}

function savePrice(){
  const name = document.getElementById('coinName').value.trim();
  const price = parseFloat(document.getElementById('coinPrice').value);
  const editIndex = document.getElementById('editIndex').value;
  
  if(!name || !price){
    alert('❌ 请填写完整信息！');
    return;
  }
  
  const coins = JSON.parse(localStorage.getItem('coinPrices') || '[]');
  
  if(editIndex === ''){
    coins.push({ name, price, updateTime: new Date().toLocaleString('zh-CN') });
  }else{
    coins[editIndex] = { name, price, updateTime: new Date().toLocaleString('zh-CN') };
  }
  
  localStorage.setItem('coinPrices', JSON.stringify(coins));
  closeModal();
  loadPrices();
  alert('✅ 保存成功！');
}

function delCoin(index){
  if(!confirm('确定删除这个币种吗？')) return;
  const coins = JSON.parse(localStorage.getItem('coinPrices') || '[]');
  coins.splice(index, 1);
  localStorage.setItem('coinPrices', JSON.stringify(coins));
  loadPrices();
  alert('✅ 已删除');
}

loadPrices();
</script>

</body>
</html>
