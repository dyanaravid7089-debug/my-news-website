<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Binex - 首页</title>
  <!-- Supabase 库 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- 配置文件 -->
  <script src="config.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#1E2026;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:80px;}
    .header{padding:20px;text-align:center;border-bottom:1px solid #2B2F36;}
    .logo{font-size:24px;font-weight:bold;color:#F3BA2F;}
    .nav-top{display:flex;justify-content:center;gap:20px;margin-top:15px;}
    .nav-top a{color:#ccc;text-decoration:none;padding:8px 16px;border-radius:4px;}
    .nav-top a:hover,.nav-top a.active{background:#2B2F36;color:#F3BA2F;}
    .container{max-width:420px;margin:40px auto;padding:0 20px;}
    .welcome{text-align:center;padding:40px 20px;}
    .welcome h1{font-size:28px;margin-bottom:10px;color:#F3BA2F;}
    .welcome p{color:#888;margin-bottom:30px;}
    .btn{display:block;width:100%;padding:14px;background:#F3BA2F;color:#000;font-size:16px;font-weight:bold;border:none;border-radius:8px;cursor:pointer;text-align:center;text-decoration:none;margin-bottom:12px;}
    .btn-secondary{background:#2B2F36;color:#fff;}
    .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#2B2F36;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #474D57;}
    .nav-item{display:flex;flex-direction:column;align-items:center;color:#888;font-size:12px;text-decoration:none;}
    .nav-item.active{color:#F3BA2F;}
    .nav-item svg{width:24px;height:24px;margin-bottom:4px;}
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">BINEX</div>
    <div class="nav-top">
      <a href="index.html" class="active">首页</a>
      <a href="login.html">登录</a>
      <a href="register.html">注册</a>
    </div>
  </div>

  <div class="container">
    <div class="welcome">
      <h1>欢迎来到 Binex</h1>
      <p>数字资产合约交易平台</p>
      <a href="login.html" class="btn">立即登录</a>
      <a href="assets.html" class="btn btn-secondary">进入资产</a>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item active">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>首页</span>
    </a>
    <a href="contract.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.76 4.84l-1.8-1.79-1.41 1.41 1.79 1.79 1.42-1.41zM4 10.5H1v2h3v-2zm9-9.95h-2V3.5h2V.55zm7.45 3.91l-1.41-1.41-1.79 1.79 1.41 1.41 1.79-1.79zm-3.21 13.7l1.79 1.8 1.41-1.41-1.8-1.79-1.4 1.4zM20 10.5v2h3v-2h-3zm-8-5c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm0 10c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4z"/></svg>
      <span>合约</span>
    </a>
    <a href="trade.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.99 11L3 15l3.99 4v-3H14v-2H6.99v-3zM21 9l-3.99-4v3H10v2h7.01v3L21 9z"/></svg>
      <span>切换</span>
    </a>
    <a href="options.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>
      <span>期权</span>
    </a>
    <a href="assets.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
      <span>资产</span>
    </a>
  </nav>
</body>
</html>
