  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#1E2026;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:80px;}
    .header{padding:15px 20px;text-align:center;border-bottom:1px solid #2B2F36;position:relative;}
    .logo{font-size:20px;font-weight:bold;color:#F3BA2F;}
    .container{max-width:480px;margin:0 auto;padding:15px;}
    .search-box{margin-bottom:15px;}
    .search-box input{width:100%;padding:12px 15px;background:#2B2F36;border:1px solid #474D57;border-radius:8px;color:#fff;font-size:15px;}
    .search-box input:focus{outline:none;border-color:#F3BA2F;}
    .coin-list{background:#2B2F36;border-radius:10px;overflow:hidden;border:1px solid #474D57;}
    .coin-header{display:flex;padding:12px 15px;background:#1E2026;color:#888;font-size:12px;border-bottom:1px solid #474D57;}
    .coin-header>div{text-align:center;}
    .coin-header .col-name{width:35%;text-align:left;}
    .coin-header .col-price{width:25%;}
    .coin-header .col-change{width:20%;}
    .coin-header .col-volume{width:20%;}
    .coin-item{display:flex;padding:14px 15px;border-bottom:1px solid #474D57;cursor:pointer;}
    .coin-item:last-child{border-bottom:none;}
    .coin-item:hover{background:#32363e;}
    .coin-item>div{display:flex;align-items:center;}
    .col-name{width:35%;}
    .coin-icon{width:32px;height:32px;border-radius:50%;background:#474D57;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#F3BA2F;font-size:13px;margin-right:10px;}
    .coin-info{}
    .coin-symbol{font-weight:bold;font-size:14px;}
    .coin-desc{font-size:11px;color:#666;margin-top:2px;}
    .col-price{width:25%;text-align:center;justify-content:center;font-size:14px;}
    .col-change{width:20%;text-align:center;justify-content:center;font-size:14px;font-weight:bold;}
    .change-up{color:#089981;}
    .change-down{color:#F23645;}
    .col-volume{width:20%;text-align:right;justify-content:right;font-size:12px;color:#888;}
    .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#2B2F36;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #474D57;}
    .nav-item{display:flex;flex-direction:column;align-items:center;color:#888;font-size:12px;text-decoration:none;}
    .nav-item.active{color:#F3BA2F;}
    .nav-item svg{width:24px;height:24px;margin-bottom:4px;}
  </style>
</head>

let filtered = coinData;

// 渲染列表
function renderList(data) {
  const tbody = document.getElementById('coinListBody');
  tbody.innerHTML = data.map(item => {
    const isUp = item.change.startsWith('+');
    return `
      <div class="coin-item" onclick="goToTrade('${item.symbol}')">
        <div class="col-name">
          <div class="coin-icon">${item.icon}</div>
          <div class="coin-info">
            <div class="coin-symbol">${item.symbol}</div>
            <div class="coin-desc">${item.name}</div>
          </div>
        </div>
        <div class="col-price">${item.price}</div>
        <div class="col-change ${isUp ? 'change-up' : 'change-down'}">${item.change}</div>
        <div class="col-volume">${item.volume}</div>
      </div>
    `;
  }).join('');
}

// 跳转到交易页
function goToTrade(symbol) {
  localStorage.setItem('trade_pair', symbol);
  window.location.href = 'trade-detail.html';
}

// 搜索功能
document.getElementById('searchInput').addEventListener('input', e => {
  const keyword = e.target.value.trim().toUpperCase();
  if (!keyword) {
    filtered = coinData;
  } else {
    filtered = coinData.filter(item => 
      item.symbol.toUpperCase().includes(keyword) || 
      item.name.toUpperCase().includes(keyword)
    );
  }
  renderList(filtered);
});

// 页面加载
document.addEventListener('DOMContentLoaded', () => {
  renderList(coinData);
});
