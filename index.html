    <title>欢迎进入不一样的圈子</title>

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        background: #2b1423;
        color: #ffffff;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Hiragino Sans", "Noto Sans JP", "Noto Sans KR", "Noto Sans Arabic", sans-serif;
        font-size: 16px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      .page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 16px;
      }

      .shell {
        width: 100%;
        max-width: 560px;
      }

      .progress {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-bottom: 32px;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.25);
        transition: width 0.4s ease, background 0.4s ease;
      }

      .dot.done {
        background: rgba(244, 217, 198, 0.6);
      }

      .dot.on {
        width: 28px;
        background: #f4d9c6;
      }

      .step {
        animation: fadeUp 0.6s ease both;
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      .hero-img {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 10;
        object-fit: cover;
        border-radius: 20px;
        margin-bottom: 32px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        background: rgba(255, 255, 255, 0.05);
      }

      h1,
      h2 {
        font-weight: 700;
        line-height: 1.2;
        text-align: center;
      }

      h1 {
        font-size: clamp(28px, 6vw, 40px);
      }

      h2 {
        font-size: clamp(26px, 5vw, 34px);
      }

      .sub {
        margin-top: 12px;
        text-align: center;
        font-size: 18px;
        color: rgba(255, 255, 255, 0.82);
      }

      .features {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
        margin: 32px 0;
      }

      @media (min-width: 520px) {
        .features {
          grid-template-columns: 1fr 1fr;
        }
      }

      .feature {
        display: flex;
        align-items: flex-start;
        gap: 14px;
        padding: 18px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        transition: transform 0.25s ease, background 0.25s ease, border-color 0.25s ease;
      }

      .feature:hover {
        transform: translateY(-3px);
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(244, 217, 198, 0.35);
      }

      .feature-icon {
        flex: none;
        width: 44px;
        height: 44px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: rgba(244, 217, 198, 0.15);
        color: #f4d9c6;
      }

      .feature h3 {
        font-size: 16px;
        font-weight: 600;
        line-height: 1.4;
      }

      .feature p {
        margin-top: 4px;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.75);
        line-height: 1.5;
      }

      .badge {
        width: 80px;
        height: 80px;
        margin: 0 auto 24px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.14);
      }

      .badge.warn {
        color: #f5b841;
        background: rgba(245, 184, 65, 0.14);
        border-color: rgba(245, 184, 65, 0.35);
      }

      .badge.ok {
        color: #6ee7a0;
        background: rgba(110, 231, 160, 0.14);
        border-color: rgba(110, 231, 160, 0.35);
      }

      .badge.ask {
        color: #f4d9c6;
      }

      .body-text {
        max-width: 460px;
        margin: 20px auto 0;
        text-align: center;
        font-size: 17px;
        line-height: 1.5;
        color: rgba(255, 255, 255, 0.88);
      }

      .panel {
        text-align: center;
      }

      .actions {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 36px;
      }

      .actions.row {
        flex-direction: row;
      }

      .actions.row .btn {
        flex: 1;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-height: 52px;
        padding: 14px 28px;
        border: 0;
        border-radius: 14px;
        font-family: inherit;
        font-size: 16px;
        font-weight: 600;
        line-height: 1.2;
        text-decoration: none;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      }

      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.3);
      }

      .btn:active {
        transform: translateY(0);
      }

      .btn:focus-visible {
        outline: 3px solid #f4d9c6;
        outline-offset: 3px;
      }

      .btn-primary {
        background: #f4d9c6;
        color: #2b1423;
      }

      .btn-primary:hover {
        background: #fbe7d8;
      }

      .btn-ghost {
        background: transparent;
        color: #ffffff;
        border: 1.5px solid rgba(255, 255, 255, 0.45);
      }

      .btn-ghost:hover {
        background: rgba(255, 255, 255, 0.08);
      }

      .btn-wa {
        background: #25d366;
        color: #0b2216;
      }

      .btn-wa:hover {
        background: #36e076;
      }

      .btn-tg {
        background: #0088cc;
        color: #ffffff;
      }

      .btn-tg:hover {
        background: #0a97de;
      }

      .arrow {
        transition: transform 0.2s ease;
      }

      .btn:hover .arrow {
        transform: translateX(3px);
      }

      [dir="rtl"] .arrow {
        transform: scaleX(-1);
      }

      [dir="rtl"] .btn:hover .arrow {
        transform: scaleX(-1) translateX(3px);
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
