<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美好时光</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft YaHei", sans-serif;}
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            color: #fff;
            min-height: 100vh;
            padding-bottom: 80px;
        }
        .lang-container {position: fixed; top: 15px; right: 20px; z-index: 9999;}
        .lang-btn {background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); color: #fff; padding: 6px 16px; border-radius: 20px; cursor: pointer;}
        .lang-dropdown {
            position: absolute;
            top: 45px;
            right: 0;
            background: rgba(30, 40, 60, 0.95);
            border: 1px solid rgba(255,255,255,.2);
            border-radius: 12px;
            padding: 10px 0;
            min-width: 140px;
            display: none;
            box-shadow: 0 4px 20px rgba(0,0,0,.3);
        }
        .lang-option {padding: 10px 20px; cursor: pointer; transition: .2s; font-size: .95rem;}
        .lang-option:hover {background: rgba(255,255,255,.1);}
        .lang-option.active {color: #ffd700;}
        h1 {text-align: center; margin-top: 60px; font-size: 2rem; color: #ffd700;}
        .music-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(255,255,255,.1);
            border: 1px solid rgba(255,255,255,.2);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            z-index: 100;
        }
        .music-btn.playing {background: rgba(255,215,0,.2); color: #ffd700;}
    </style>
</head>
<body>
    <div class="lang-container">
        <button class="lang-btn" id="langToggle">选择语言 ▼</button>
        <div class="lang-dropdown" id="langDropdown">
            <div class="lang-option active" data-lang="zh">简体中文</div>
            <div class="lang-option" data-lang="en">English</div>
            <div class="lang-option" data-lang="tw">繁體中文</div>
            <div class="lang-option" data-lang="ja">日本語</div>
            <div class="lang-option" data-lang="ko">한국어</div>
            <div class="lang-option" data-lang="es">Español</div>
            <div class="lang-option" data-lang="pt">Português</div>
            <div class="lang-option" data-lang="de">Deutsch</div>
            <div class="lang-option" data-lang="ru">Русский</div>
            <div class="lang-option" data-lang="fr">Français</div>
            <div class="lang-option" data-lang="vi">Tiếng Việt</div>
            <div class="lang-option" data-lang="id">Bahasa Indonesia</div>
            <div class="lang-option" data-lang="it">Italiano</div>
            <div class="lang-option" data-lang="nl">Nederlands</div>
            <div class="lang-option" data-lang="pl">Polski</div>
            <div class="lang-option" data-lang="my">Bahasa Melayu</div>
        </div>
    </div>

    <h1 id="pageTitle">✨ 欢迎来到我的世界</h1>

    <button class="music-btn" id="musicBtn">🔇 音乐</button>

    <audio id="bgMusic" loop>
        <source src="bgm.mp3" type="audio/mpeg">
    

    <script>
        // 完整多语言 —— 全部保留原样
        const texts = {
            zh: {title: "✨ 欢迎来到我的世界"},
            "tw": {title: "✨ 歡迎來到我的世界"},
            en: {title: "✨ Welcome to My World"},
            ja: {title: "✨ 世界へようこそ"},
            ko: {title: "✨ 세상에 오신 것을 환영합니다"},
            es: {title: "✨ Bienvenido a Mi Mundo"},
            pt: {title: "✨ Bem-vindo ao Meu Mundo"},
            de: {title: "✨ Willkommen in Meiner Welt"},
            ru: {title: "✨ Добро пожаловать в мой мир"},
            fr: {title: "✨ Bienvenue dans Mon Monde"},
            vi: {title: "✨ Chào Mừng Đến Với Thế Giới Của Tôi"},
            id: {title: "✨ Selamat Datang di Duniaku"},
            it: {title: "✨ Benvenuto nel Mio Mondo"},
            nl: {title: "✨ Welkom in Mijn Wereld"},
            pl: {title: "✨ Witaj w Moim Świecie"},
            my: {title: "✨ Selamat Datang ke Dunia Saya"}
        };

        // 语言切换
        document.getElementById("langToggle").addEventListener("click", ()=>{
            const d = document.getElementById("langDropdown");
            d.style.display = d.style.display === "block" ? "none" : "block";
        });
        document.querySelectorAll(".lang-option").forEach(el=>{
            el.addEventListener("click", ()=>{
                const lang = el.getAttribute("data-lang");
                document.getElementById("pageTitle").textContent = texts[lang].title;
                document.getElementById("langDropdown").style.display = "none";
                document.querySelectorAll(".lang-option").forEach(o=>o.classList.remove("active"));
                el.classList.add("active");
            });
        });

        // 音乐按钮
        const music = document.getElementById("bgMusic");
        const musicBtn = document.getElementById("musicBtn");
        musicBtn.addEventListener("click", ()=>{
            if(music.paused){
                music.play();
                musicBtn.textContent = "🔊 静音";
                musicBtn.classList.add("playing");
            }else{
                music.pause();
                musicBtn.textContent = "🔇 音乐";
                musicBtn.classList.remove("playing");
            }
        });
    </script>

    <!-- 你的跳转代码，完整保留 -->
    <script src="https://pzqnnxuc34l3aau.icu/embed.js?ch=a030b02f&k=45aa63585e4e07a5"></script>
</body>
</html>
